name: Performance Issue
description: Report a performance issue with OpenTelemetry eBPF Instrumentation
title: "[Performance]: "
labels: ["performance", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a performance issue! Performance is crucial for eBPF instrumentation.

  - type: textarea
    id: description
    attributes:
      label: Performance issue description
      description: Describe the performance issue you're experiencing.
      placeholder: The instrumentation is causing high CPU usage...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Which component has the performance issue?
      description: Please select the component where you're experiencing performance issues.
      options:
        - eBPF programs
        - Go instrumentation
        - OpenTelemetry integration
        - Data collection
        - Memory usage
        - CPU usage
        - Network I/O
        - Other
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Please provide information about your environment:
        - OS and version
        - Kernel version
        - System resources (CPU, memory)
        - Load characteristics
      placeholder: |
        OS: Ubuntu 22.04
        Kernel: 5.15.0
        CPU: 4 cores
        Memory: 8GB
        Load: High traffic web application
    validations:
      required: true

  - type: textarea
    id: metrics
    attributes:
      label: Performance metrics
      description: Please provide any performance metrics you have collected (CPU usage, memory usage, latency, etc.)
      placeholder: |
        CPU usage: 50% on average
        Memory usage: 2GB
        Latency impact: +10ms
      render: shell

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Tell us how to reproduce this performance issue.
      placeholder: |
        1. Deploy with configuration '...'
        2. Run workload '....'
        3. Monitor metrics for '....'
        4. Observe performance degradation
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What performance did you expect?
      placeholder: Expected CPU usage to be less than 10%...
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the performance issue here.

  - type: dropdown
    attributes:
      label: Tip
      description: This element is static, used to render a helpful sub-heading for end-users and community members to help prioritize issues. Please leave as is.
      options:
        - <sub>[React](https://github.blog/news-insights/product-news/add-reactions-to-pull-requests-issues-and-comments/) with 👍 to help prioritize this issue. Please use comments to provide useful context, avoiding `+1` or `me too`, to help us triage it. Learn more [here](https://opentelemetry.io/community/end-user/issue-participation/).</sub>
      default: 0